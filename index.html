<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Design Flat | 3' Baggiovara &amp; Maranello - Guida Ospiti</title>
  <style>
    :root {
      --bg: #f3f4f6;
      --card: #ffffff;
      --text: #172554;
      --muted: #64748b;
      --accent: #0f172a;
      --accent-2: #1e293b;
      --border: #e5e7eb;
      --soft: #f8fafc;
      --warning-bg: #fff7ed;
      --warning-border: #fed7aa;
      --warning-text: #9a3412;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
      --radius: 18px;
      --link: #1d4ed8;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    a {
      color: var(--link);
      text-decoration: none;
    }

    a:hover { text-decoration: underline; }

    .container {
      width: 100%;
      max-width: 920px;
      margin: 0 auto;
      padding: 20px;
    }

    .hero-image {
      width: 100%;
      height: 260px;
      background: linear-gradient(rgba(15, 23, 42, 0.12), rgba(15, 23, 42, 0.12)), url("./cover.jpg") center/cover no-repeat;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      margin-bottom: 18px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 22px;
      margin-bottom: 20px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 30px;
      line-height: 1.2;
      color: var(--accent);
    }

    h2 {
      margin: 0 0 16px;
      font-size: 22px;
      color: var(--accent);
    }

    h3 {
      margin: 0 0 8px;
      font-size: 18px;
      color: var(--accent);
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 17px;
    }

    .intro-text {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 15px;
    }

    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 18px;
    }

    .btn,
    .btn-secondary,
    .lang-btn {
      min-height: 50px;
      border-radius: 14px;
      border: 2px solid var(--accent-2);
      font-size: 16px;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 16px;
      transition: 0.2s ease;
      text-align: center;
    }

    .btn,
    .btn-secondary {
      flex: 1 1 220px;
    }

    .btn {
      background: var(--accent);
      color: #fff;
    }

    .btn:hover {
      background: #020617;
      text-decoration: none;
    }

    .btn-secondary,
    .lang-btn {
      background: var(--soft);
      color: var(--accent);
    }

    .btn-secondary:hover,
    .lang-btn:hover {
      background: #eef2f7;
      text-decoration: none;
    }

    .lang-btn {
      flex: 1 1 120px;
    }

    .lang-btn.active {
      background: var(--accent);
      color: #fff;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }

    .info-item { margin-bottom: 18px; }

    .label {
      display: block;
      font-size: 14px;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 4px;
    }

    .value {
      font-size: 16px;
      color: #0f172a;
    }

    .note {
      font-size: 14px;
      color: var(--muted);
    }

    .accordion {
      display: grid;
      gap: 12px;
    }

    details {
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--soft);
      overflow: hidden;
    }

    summary {
      list-style: none;
      min-height: 56px;
      padding: 15px 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      color: var(--accent);
      font-size: 17px;
      font-weight: 700;
    }

    summary::-webkit-details-marker { display: none; }

    summary::after {
      content: "+";
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 1px solid var(--border);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
      background: #fff;
      color: var(--accent);
      font-size: 19px;
      line-height: 1;
    }

    details[open] summary::after { content: "-"; }

    .details-content {
      padding: 0 18px 18px;
      color: #0f172a;
    }

    .steps,
    .list {
      margin: 0;
      padding-left: 24px;
    }

    .steps li,
    .list li {
      margin-bottom: 10px;
      font-size: 16px;
    }

    .photo-note {
      margin: 12px 0 4px;
      display: grid;
      gap: 8px;
    }

    .photo-note img {
      width: 100%;
      max-height: 460px;
      object-fit: cover;
      border-radius: 14px;
      border: 1px solid var(--border);
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.08);
      background: #fff;
    }

    .photo-note figcaption {
      color: var(--muted);
      font-size: 14px;
    }

    .photo-pair {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-top: 12px;
    }

    .highlight {
      margin: 14px 0;
      padding: 14px 16px;
      border: 1px solid var(--warning-border);
      border-radius: 14px;
      background: var(--warning-bg);
      color: var(--warning-text);
      font-weight: 700;
    }

    .mini-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .mini-card {
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--soft);
      padding: 16px;
    }

    .place-list {
      display: grid;
      gap: 12px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .place-list li {
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .place-list li:last-child {
      padding-bottom: 0;
      border-bottom: 0;
    }

    .place-list a {
      display: inline-block;
      margin-bottom: 3px;
      font-weight: 700;
    }

    .cta-card,
    .ecosystem-card { text-align: center; }

    .cta-text,
    .ecosystem-text {
      max-width: 640px;
      margin: 0 auto 18px;
      color: var(--muted);
      font-size: 16px;
    }

    .ecosystem-card {
      background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
    }

    .ecosystem-kicker {
      display: inline-block;
      margin-bottom: 10px;
      padding: 7px 12px;
      border-radius: 999px;
      border: 1px solid var(--warning-border);
      background: var(--warning-bg);
      color: var(--warning-text);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    @media (max-width: 720px) {
      .hero-image { height: 200px; }
      h1 { font-size: 26px; }
      .grid-2,
      .mini-grid { grid-template-columns: 1fr; }
      .photo-pair { grid-template-columns: 1fr; }
      .btn,
      .btn-secondary,
      .lang-btn { flex-basis: 100%; }
    }
  </style>
</head>

    function setText(id, value, asHtml = false) {
      const element = document.getElementById(id);
      if (!element) return;
      if (asHtml) element.innerHTML = value;
      else element.textContent = value;
    }

    function renderList(id, items) {
      document.getElementById(id).innerHTML = items.map(item => `<li>${item}</li>`).join("");
    }

    function renderPlaces(id, items) {
      document.getElementById(id).innerHTML = items.map(item => {
        const extra = item.extra ? ` <span class="note">(<a href="${item.extraHref}" target="_blank" rel="noopener noreferrer">${item.extra}</a>)</span>` : "";
        return `<li><a href="${item.href}" target="_blank" rel="noopener noreferrer">${item.name}</a>${extra}<div class="note">${item.text}</div></li>`;
      }).join("");
    }

    function setLanguage(lang) {
      const t = translations[lang];
      document.documentElement.lang = lang;

      Object.keys(t).forEach(key => {
        if (Array.isArray(t[key]) || typeof t[key] === "object") return;
        setText(key, t[key], key === "addressValue");
      });

      renderList("accessList", t.accessList);
      renderList("rulesList", t.rulesList);
      renderList("trashList", t.trashList);
      renderList("checkoutList", t.checkoutList);
      renderList("distancesList", t.distancesList);
      renderList("emergencyList", t.emergencyList);
      renderPlaces("breakfastList", t.breakfastList);
      renderPlaces("restaurantsList", t.restaurantsList);
      renderPlaces("aperitifsList", t.aperitifsList);

      document.querySelectorAll(".lang-btn").forEach(button => {
        button.classList.toggle("active", button.dataset.lang === lang);
      });

      const wa = document.getElementById("waButton");
      const messages = {
        it: "Buongiorno, sono un ospite di Design Flat | 3' Baggiovara & Maranello",
        en: "Hello, I am a guest of Design Flat | 3' Baggiovara & Maranello",
        fr: "Bonjour, je suis un hôte de Design Flat | 3' Baggiovara & Maranello",
        es: "Hola, soy un huésped de Design Flat | 3' Baggiovara & Maranello",
        de: "Guten Tag, ich bin Gast im Design Flat | 3' Baggiovara & Maranello"
      };
      wa.href = `https://wa.me/393290624796?text=${encodeURIComponent(messages[lang])}`;
    }

    setLanguage("it");
  </script>
